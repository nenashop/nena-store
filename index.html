<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nena Store</title>
<style>
body {
    font-family: Arial;
    margin: 0;
    background: #fff5fa;
}
header {
    background: #d86aa5;
    color: white;
    text-align: center;
    padding: 25px;
}
h1 {
    margin: 0;
}
.products {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}
.card {
    background: white;
    margin: 15px;
    padding: 20px;
    width: 200px;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 0 10px #ddd;
}
button {
    background: #d86aa5;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
}
</style>
</head>

<body>

<header>
<h1>✨ Nena Store ✨</h1>
<p>ملابس | إكسسوارات | كفرات | مكياج</p>
</header>

<div class="products">

<div class="card">
<h2>👗 ملابس</h2>
<p>أحدث صيحات الموضة</p>
<button>تسوقي الآن</button>
</div>

<div class="card">
<h2>👜 إكسسوارات</h2>
<p>قطع مميزة وأنيقة</p>
<button>تسوقي الآن</button>
</div>

<div class="card">
<h2>📱 كفرات</h2>
<p>كفرات بأشكال جميلة</p>
<button>تسوقي الآن</button>
</div>

<div class="card">
<h2>💄 مكياج</h2>
<p>منتجات تجميل رائعة</p>
<button>تسوقي الآن</button>
</div>

</div>

</body>
</html>
